<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0B1120" />
    </linearGradient>
    <linearGradient id="crimson" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#F87171" />
      <stop offset="55%" stop-color="#EF4444" />
      <stop offset="100%" stop-color="#B91C1C" />
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0.8" y2="1">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="55%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)" stroke="#334155" stroke-width="2.5" />

  <!-- Subtle diagonal impact slash backdrop -->
  <path d="M12 52 L52 12" stroke="#F59E0B" stroke-opacity="0.18" stroke-width="6" stroke-linecap="round" />

  <!-- Signature twin clash chevrons -->
  <path
    d="M11 32 L25 11 L35 11 L24 32 L36 53 L26 53 Z"
    fill="url(#crimson)"
    stroke="#0B1120"
    stroke-width="2.5"
    stroke-linejoin="round"
  />
  <path
    d="M28 32 L42 11 L52 11 L41 32 L53 53 L43 53 Z"
    fill="url(#amber)"
    stroke="#0B1120"
    stroke-width="2.5"
    stroke-linejoin="round"
  />

  <!-- Crisp center clash highlight -->
  <circle cx="34" cy="32" r="2.6" fill="#FEF08A" />
